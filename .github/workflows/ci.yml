name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt pytest httpx

      - name: Run the tests
        run: python -m pytest -v

  image:
    name: Docker image builds and answers
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t intrusion-api .

      - name: Start a container and call it
        run: |
          docker run -d --name api -p 8000:8000 intrusion-api
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 3
          done
          echo
          curl -sf http://127.0.0.1:8000/model
          docker rm -f api